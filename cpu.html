<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareVS — Битва Процессоров</title>
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: #140e28;
            --accent-purple: #8a2be2;
            --neon-glow: #bf55ec;
            --text-color: #e2daf8;
            --bar-color-1: #2f81f7;
            --bar-color-2: #e55350;
            --bar-color-3: #3fb950;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .back-link {
            align-self: flex-start;
            color: #bfaee3;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: color 0.2s;
            margin-bottom: 20px;
        }
        .back-link:hover { color: var(--neon-glow); }
        .header { text-align: center; margin-bottom: 35px; }
        .header h1 { 
            font-size: 2.6rem; margin: 0; font-weight: 900; 
            background: linear-gradient(45deg, var(--accent-purple), var(--neon-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        
        .compare-container {
            background-color: var(--card-bg); border: 1px solid #302654; border-radius: 16px;
            padding: 30px; max-width: 650px; width: 100%; box-shadow: 0 12px 32px rgba(0,0,0,0.6); box-sizing: border-box;
        }
        .select-group { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center; margin-bottom: 24px; }
        .vs-label { font-weight: bold; color: #8b949e; font-size: 1.2rem; }
        select {
            background-color: #211a3d; color: var(--text-color); border: 1px solid #302654;
            border-radius: 8px; padding: 14px; font-size: 1rem; outline: none; cursor: pointer; width: 100%; box-sizing: border-box;
        }
        select:focus { border-color: var(--neon-glow); }
        
        button {
            width: 100%; background: linear-gradient(90deg, var(--accent-purple), var(--neon-glow)); color: #fff;
            border: none; border-radius: 8px; padding: 16px; font-size: 1.15rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 14px rgba(138, 43, 226, 0.4); transition: transform 0.1s ease, filter 0.2s;
        }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.98); }

        .results { margin-top: 35px; display: none; }
        .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #fff; border-bottom: 1px solid #302654; padding-bottom: 8px; }
        .result-item { margin-bottom: 24px; }
        .cpu-name-label { font-size: 0.95rem; color: #bfaee3; margin-bottom: 6px; }
        
        .bar-container { background-color: #1a1331; border-radius: 8px; height: 28px; overflow: hidden; border: 1px solid #302654; position: relative; }
        .bar {
            height: 100%; width: 0%; transition: width 1.2s cubic-bezier(0.1, 1, 0.1, 1); 
            display: flex; align-items: center; padding-left: 12px; font-size: 0.95rem; font-weight: bold; color: #fff; box-sizing: border-box;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .bar-cores { background: linear-gradient(90deg, #1f6feb, var(--bar-color-1)); }
        .bar-watt { background: linear-gradient(90deg, #e55350, var(--bar-color-2)); }
        .bar-power { background: linear-gradient(90deg, #2ea043, var(--bar-color-3)); }
        
        .summary { margin-top: 30px; padding: 18px; background-color: rgba(138, 43, 226, 0.1); border-left: 4px solid var(--accent-purple); border-radius: 0 8px 8px 0; font-size: 1.1rem; line-height: 1.5; }
        @media (max-width: 500px) { .select-group { grid-template-columns: 1fr; justify-items: center; } .vs-label { margin: 5px 0; } }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">⬅ На главную</a>

    <div class="header">
        <h1>Битва процессоров</h1>
    </div>

    <div class="compare-container">
        <div class="select-group">
            <select id="cpu1">
                <option value="" disabled selected>Выберите процессор 1 ⬇</option>
            </select>
            <div class="vs-label">VS</div>
            <select id="cpu2">
                <option value="" disabled selected>Выберите процессор 2 ⬇</option>
            </select>
        </div>

        <button onclick="compareCPUs()">Сравнить процессоры!</button>

        <div class="results" id="resultsBlock">
            <div class="section-title">📊 Ядра / Потоки:</div>
            <div class="result-item"><div class="cpu-name-label" id="coresName1">Процессор 1</div><div class="bar-container"><div class="bar bar-cores" id="barCores1">0</div></div></div>
            <div class="result-item"><div class="cpu-name-label" id="coresName2">Процессор 2</div><div class="bar-container"><div class="bar bar-cores" id="barCores2">0</div></div></div>

            <div class="section-title">⚡ Тепловыделение (TDP Ватт):</div>
            <div class="result-item"><div class="cpu-name-label" id="wattName1">Процессор 1</div><div class="bar-container"><div class="bar bar-watt" id="barWatt1">0</div></div></div>
            <div class="result-item"><div class="cpu-name-label" id="wattName2">Процессор 2</div><div class="bar-container"><div class="bar bar-watt" id="barWatt2">0</div></div></div>

            <div class="section-title">🚀 Чистая мощность (Баллы PassMark):</div>
            <div class="result-item"><div class="cpu-name-label" id="powerName1">Процессор 1</div><div class="bar-container"><div class="bar bar-power" id="barPower1">0</div></div></div>
            <div class="result-item"><div class="cpu-name-label" id="powerName2">Процессор 2</div><div class="bar-container"><div class="bar bar-power" id="barPower2">0</div></div></div>

            <div class="summary" id="summaryText"></div>
        </div>
    </div>

    <script>
        // База процессоров Intel и AMD (Имя, баллы PassMark, Ватт TDP, Ядра)
        const cpuDatabase = [
            { name: "Intel Core i3-2120 🔹", score: 1900, watt: 65, cores: 2, text: "2/4" },
            { name: "Intel Core i3-8100", score: 6100, watt: 65, cores: 4, text: "4/4" },
            { name: "Intel Core i3-10100F", score: 8700, watt: 65, cores: 4, text: "4/8" },
            { name: "Intel Core i3-12100F", score: 14000, watt: 58, cores: 4, text: "4/8" },
            { name: "Intel Core i3-14100F", score: 15300, watt: 60, cores: 4, text: "4/8" },
            
            { name: "Intel Core i5-4460", score: 4800, watt: 84, cores: 4, text: "4/4" },
            { name: "Intel Core i5-10400F", score: 12100, watt: 65, cores: 6, text: "6/12" },
            { name: "Intel Core i5-12400F", score: 19500, watt: 65, cores: 6, text: "6/12" },
            { name: "Intel Core i5-13400F", score: 25000, watt: 65, cores: 10, text: "10/16" },
            { name: "Intel Core i5-14600K", score: 39000, watt: 125, cores: 14, text: "14/20" },

            { name: "Intel Core i7-8700K", score: 13500, watt: 95, cores: 6, text: "6/12" },
            { name: "Intel Core i7-10700K", score: 19200, watt: 125, cores: 8, text: "8/16" },
            { name: "Intel Core i7-12700F", score: 31000, watt: 65, cores: 12, text: "12/20" },
            { name: "Intel Core i7-13700K", score: 46000, watt: 125, cores: 16, text: "16/24" },
            { name: "Intel Core i7-14700K", score: 53000, watt: 125, cores: 20, text: "20/28" },

            { name: "Intel Core i9-9900K", score: 18500, watt: 95, cores: 8, text: "8/16" },
            { name: "Intel Core i9-12900K", score: 41000, watt: 125, cores: 16, text: "16/24" },
            { name: "Intel Core i9-13900K", score: 59000, watt: 125, cores: 24, text: "24/32" },
            { name: "Intel Core i9-14900KS 👑", score: 64000, watt: 150, cores: 24, text: "24/32" },
            
            { name: "AMD Ryzen 3 1200", score: 6300, watt: 65, cores: 4, text: "4/4" },
            { name: "AMD Ryzen 3 3100", score: 11500, watt: 65, cores: 4, text: "4/8" },
            { name: "AMD Ryzen 3 4100", score: 11100, watt: 65, cores: 4, text: "4/8" },

            { name: "AMD Ryzen 5 1600 (AF) 🔹", score: 12200, watt: 65, cores: 6, text: "6/12" },
            { name: "AMD Ryzen 5 2600", score: 13200, watt: 65, cores: 6, text: "6/12" },
            { name: "AMD Ryzen 5 3600", score: 17800, watt: 65, cores: 6, text: "6/12" },
            { name: "AMD Ryzen 5 5600X", score: 21900, watt: 65, cores: 6, text: "6/12" },
            { name: "AMD Ryzen 5 7500F", score: 27000, watt: 65, cores: 6, text: "6/12" },
            { name: "AMD Ryzen 5 7600X", score: 28500, watt: 105, cores: 6, text: "6/12" },

            { name: "AMD Ryzen 7 2700X", score: 17500, watt: 105, cores: 8, text: "8/16" },
            { name: "AMD Ryzen 7 3700X", score: 22700, watt: 65, cores: 8, text: "8/16" },
            { name: "AMD Ryzen 7 5700X", score: 26700, watt: 65, cores: 8, text: "8/16" },
            { name: "AMD Ryzen 7 5800X3D 🔥", score: 28000, watt: 105, cores: 8, text: "8/16" },
            { name: "AMD Ryzen 7 7700X", score: 36000, watt: 105, cores: 8, text: "8/16" },
            { name: "AMD Ryzen 7 7800X3D 🎮", score: 34500, watt: 120, cores: 8, text: "8/16" },

            { name: "AMD Ryzen 9 3900X", score: 32800, watt: 105, cores: 12, text: "12/24" },
            { name: "AMD Ryzen 9 5950X", score: 45800, watt: 105, cores: 16, text: "16/32" },
{ name: "AMD Ryzen 9 7900X", score: 52000, watt: 170, cores: 12, text: "12/24" },
{ name: "AMD Ryzen 9 7950X3D 🚀", score: 62500, watt: 120, cores: 16, text: "16/32" }
];
const s1 = document.getElementById('cpu1');
const s2 = document.getElementById('cpu2');
cpuDatabase.forEach((cpu, index) => {
let opt1 = document.createElement('option'); opt1.value = index; opt1.textContent = cpu.name; s1.appendChild(opt1);
let opt2 = document.createElement('option'); opt2.value = index; opt2.textContent = cpu.name; s2.appendChild(opt2);
});
function compareCPUs() {
const index1 = s1.value; const index2 = s2.value;
if (index1 === "" || index2 === "") { alert('Пожалуйста, выберите оба процессора!'); return; }
const proc1 = cpuDatabase[index1]; const proc2 = cpuDatabase[index2];
document.getElementById('coresName1').innerText = proc1.name;
document.getElementById('coresName2').innerText = proc2.name;
document.getElementById('wattName1').innerText = proc1.name;
document.getElementById('wattName2').innerText = proc2.name;
document.getElementById('powerName1').innerText = proc1.name;
document.getElementById('powerName2').innerText = proc2.name;
const maxCores = Math.max(proc1.cores, proc2.cores, 1);
const maxWatt = Math.max(proc1.watt, proc2.watt, 1);
const maxScore = Math.max(proc1.score, proc2.score, 1);
document.getElementById('resultsBlock').style.display = 'block';
setTimeout(() => {
const bCores1 = document.getElementById('barCores1'); const bCores2 = document.getElementById('barCores2');
bCores1.style.width = (proc1.cores / maxCores * 100) + '%'; bCores1.innerText = proc1.text;
bCores2.style.width = (proc2.cores / maxCores * 100) + '%'; bCores2.innerText = proc2.text;
const bWatt1 = document.getElementById('barWatt1'); const bWatt2 = document.getElementById('barWatt2');
bWatt1.style.width = (proc1.watt / maxWatt * 100) + '%'; bWatt1.innerText = proc1.watt + ' W';
bWatt2.style.width = (proc2.watt / maxWatt * 100) + '%'; bWatt2.innerText = proc2.watt + ' W';
const bPower1 = document.getElementById('barPower1'); const bPower2 = document.getElementById('barPower2');
bPower1.style.width = (proc1.score / maxScore * 100) + '%'; bPower1.innerText = proc1.score + ' pts';
bPower2.style.width = (proc2.score / maxScore * 100) + '%'; bPower2.innerText = proc2.score + ' pts';
}, 50);
function getBallWord(num) {
let n = Math.abs(num) % 100; if (n >= 5 && n <= 20) return 'баллов';
n %= 10; if (n === 1) return 'балл'; if (n >= 2 && n <= 4) return 'балла'; return 'баллов';
}
const diff = Math.abs(proc1.score - proc2.score);
let text = '';
if (proc1.score > proc2.score) {
text = Процессор <strong>${proc1.name}</strong> мощнее в тестах ровно на <strong>${diff}</strong> ${getBallWord(diff)}!;
} else if (proc2.score > proc1.score) {
text = Процессор <strong>${proc2.name}</strong> мощнее в тестах ровно на <strong>${diff}</strong> ${getBallWord(diff)}!;
} else {
text = Оба процессора имеют абсолютно одинаковую общую производительность!;
}
document.getElementById('summaryText').innerHTML = text;
}
