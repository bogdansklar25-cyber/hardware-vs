<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareVS — Сравнение Видеокарт</title>
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: #140e28;
            --accent-purple: #8a2be2;
            --neon-glow: #bf55ec;
            --text-color: #e2daf8;
            --bar-color-1: #2f81f7;
            --bar-color-2: #e55350;
            --bar-color-3: #3fb950;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
        }
        .back-link { align-self: flex-start; color: #bfaee3; text-decoration: none; font-weight: bold; font-size: 1.1rem; transition: color 0.2s; margin-bottom: 20px; }
        .back-link:hover { color: var(--neon-glow); }
        .header { text-align: center; margin-bottom: 35px; }
        .header h1 { 
            font-size: 2.6rem; margin: 0; font-weight: 900; 
            background: linear-gradient(45deg, var(--accent-purple), var(--neon-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px;
        }
        .compare-container {
            background-color: var(--card-bg); border: 1px solid #302654; border-radius: 16px;
            padding: 30px; max-width: 650px; width: 100%; box-shadow: 0 12px 32px rgba(0,0,0,0.6); box-sizing: border-box;
        }
        .select-group { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center; margin-bottom: 24px; }
        .vs-label { font-weight: bold; color: #8b949e; font-size: 1.2rem; }
        select {
            background-color: #211a3d; color: var(--text-color); border: 1px solid #302654;
            border-radius: 8px; padding: 14px; font-size: 1rem; outline: none; cursor: pointer; width: 100%; box-sizing: border-box;
            transition: border-color 0.2s;
        }
        select:focus { border-color: var(--neon-glow); }
        button {
            width: 100%; background: linear-gradient(90deg, var(--accent-purple), var(--neon-glow)); color: #fff;
            border: none; border-radius: 8px; padding: 16px; font-size: 1.15rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 14px rgba(138, 43, 226, 0.4); transition: transform 0.1s ease, filter 0.2s;
        }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.98); }
        .results { margin-top: 35px; display: none; }
        .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #fff; border-bottom: 1px solid #302654; padding-bottom: 8px; }
        .result-item { margin-bottom: 24px; }
        .gpu-name-label { font-size: 0.95rem; color: #bfaee3; margin-bottom: 6px; }
        .bar-container { background-color: #1a1331; border-radius: 8px; height: 28px; overflow: hidden; border: 1px solid #302654; position: relative; }
        .bar {
            height: 100%; width: 0%; transition: width 1.2s cubic-bezier(0.1, 1, 0.1, 1); 
            display: flex; align-items: center; padding-left: 12px; font-size: 0.95rem; font-weight: bold; color: #fff; box-sizing: border-box;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .bar-mem { background: linear-gradient(90deg, #1f6feb, #2f81f7); }
        .bar-watt { background: linear-gradient(90deg, #e55350, #e55350); }
        .bar-power { background: linear-gradient(90deg, #2ea043, #3fb950); }
        .summary { margin-top: 30px; padding: 18px; background-color: rgba(138, 43, 226, 0.1); border-left: 4px solid var(--accent-purple); border-radius: 0 8px 8px 0; font-size: 1.1rem; line-height: 1.5; }
        @media (max-width: 500px) { .select-group { grid-template-columns: 1fr; justify-items: center; } .vs-label { margin: 5px 0; } }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">⬅ На главную</a>

    <div class="header">
        <h1>Сравнение видеокарт</h1>
    </div>

    <div class="compare-container">
        <div class="select-group">
            <select id="gpu1">
                <option value="" disabled selected>Выберите карту 1 ⬇</option>
            </select>
            <div class="vs-label">VS</div>
            <select id="gpu2">
                <option value="" disabled selected>Выберите карту 2 ⬇</option>
            </select>
        </div>

        <button onclick="compareGPUs()">Сравнить видеокарты!</button>

        <div class="results" id="resultsBlock">
            <div class="section-title">📋 Объем видеопамяти:</div>
            <div class="result-item"><div class="gpu-name-label" id="memName1">Карта 1</div><div class="bar-container"><div class="bar bar-mem" id="barMem1">0</div></div></div>
            <div class="result-item"><div class="gpu-name-label" id="memName2">Карта 2</div><div class="bar-container"><div class="bar bar-mem" id="barMem2">0</div></div></div>

            <div class="section-title">⚡ Потребление энергии (Ватты):</div>
            <div class="result-item"><div class="gpu-name-label" id="wattName1">Карта 1</div><div class="bar-container"><div class="bar bar-watt" id="barWatt1">0</div></div></div>
            <div class="result-item"><div class="gpu-name-label" id="wattName2">Карта 2</div><div class="bar-container"><div class="bar bar-watt" id="barWatt2">0</div></div></div>

            <div class="section-title">🚀 Мощность (Чистые баллы PassMark):</div>
            <div class="result-item"><div class="gpu-name-label" id="powerName1">Карта 1</div><div class="bar-container"><div class="bar bar-power" id="barPower1">0</div></div></div>
            <div class="result-item"><div class="gpu-name-label" id="powerName2">Карта 2</div><div class="bar-container"><div class="bar bar-power" id="barPower2">0</div></div></div>

            <div class="summary" id="summaryText"></div>
        </div>
    </div>
