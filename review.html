<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareVS — Отзывы администрации</title>
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: #140e28;
            --accent-purple: #8a2be2;
            --neon-glow: #bf55ec;
            --text-color: #e2daf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; box-sizing: border-box;
        }
        .back-link { color: #bfaee3; text-decoration: none; font-weight: bold; font-size: 1.1rem; position: absolute; top: 25px; left: 25px; }
        .back-link:hover { color: var(--neon-glow); }
        .alert-box {
            background-color: var(--card-bg); border: 2px solid var(--accent-purple); border-radius: 16px;
            padding: 40px 30px; max-width: 550px; width: 100%; box-shadow: 0 0 30px rgba(138,43,226,0.25); text-align: center; box-sizing: border-box;
        }
        .alert-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .alert-title { font-size: 1.6rem; font-weight: 900; color: #fff; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .alert-desc { font-size: 1.05rem; color: #bfaee3; line-height: 1.6; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">⬅ На главную</a>

    <div class="alert-box">
        <div class="alert-icon">🔧</div>
        <div class="alert-title">Модернизация раздела</div>
        <div class="alert-desc">Форма отправки отзывов администрации временно заморожена. Мы переписываем систему безопасности интерфейса, чтобы писем доходили до почты мгновенно и без сбоев. Возвращайтесь совсем скоро!</div>
    </div>

</body>
</html>
