<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareVS — Главная</title>
    <style>
        body { 
            background-color: #0b0713; 
            font-family: 'Segoe UI', sans-serif; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            user-select: none;
        }
        .main-container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 42px;
            color: #a855f7;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
            letter-spacing: 1px;
        }
        .buttons-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .btn-style {
            display: block;
            width: 100%;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }
        .btn-purple {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        .btn-purple:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.8);
        }
        .btn-gold {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }
        .btn-gold:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.8);
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>HardwareVS</h1>
    
    <div class="buttons-stack">
        <!-- ФИОЛЕТОВЫЕ КНОПКИ СРАВНЕНИЯ -->
        <a href="cpu.html" class="btn-style btn-purple">💻 Сравнить процессоры</a>
        <a href="gpu.html" class="btn-style btn-purple">🎮 Сравнить видеокарты</a>
        
        <!-- ЗОЛОТАЯ КНОПКА VIP-СТАТУСА -->
        <a href="vip.html" class="btn-style btn-gold">👑 АКТИВАЦИЯ VIP</a>
    </div>
</div>

<script>
    // Защита кода от F12 на главной странице
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };
</script>

</body>
</html>
