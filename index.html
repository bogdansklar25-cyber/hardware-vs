<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareVS — Сравнение комплектующих</title>
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: #140e28;
            --accent-purple: #8a2be2;
            --neon-glow: #bf55ec;
            --text-color: #e2daf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .header h1 { 
            font-size: 3.5rem; 
            margin: 0; 
            font-weight: 900; 
            background: linear-gradient(45deg, var(--accent-purple), var(--neon-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 15px rgba(191, 85, 236, 0.3));
        }
        
        .buttons-container {
            display: flex;
            gap: 25px;
            max-width: 600px;
            width: 100%;
        }
        
        .nav-btn {
            flex: 1;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--accent-purple);
            border-radius: 12px;
            padding: 24px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        
        .nav-btn:hover {
            background-color: var(--accent-purple);
            color: #fff;
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.6);
            border-color: var(--neon-glow);
        }
        
        .nav-btn:active {
            transform: translateY(-1px);
        }

        @media (max-width: 500px) {
            .buttons-container {
                flex-direction: column;
                gap: 15px;
                padding: 0 10px;
            }
            .nav-btn { padding: 20px; font-size: 1.15rem; }
            .header h1 { font-size: 2.6rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>HardwareVS</h1>
    </div>

    <div class="buttons-container">
        <!-- Кнопки реагируют на наведение и ведут на отдельные файлы сравнения -->
        <a href="gpu.html" class="nav-btn">Сравнить видеокарты</a>
        <a href="cpu.html" class="nav-btn">Сравнить процессоры</a>
    </div>

</body>
</html>
