<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareVS — Сравнение комплектующих</title>
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: #140e28;
            --accent-purple: #8a2be2;
            --neon-glow: #bf55ec;
            --text-color: #e2daf8;
            --input-bg: #211a3d;
            --myth-orange: #ff9f00;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; box-sizing: border-box; position: relative; overflow: hidden;
        }

        /* 🎬 КРАТКИЙ ПРЕЛОАДЕР */
        #cinema-intro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #05030a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease, visibility 0.4s; }
        #cinema-intro.fade-out { opacity: 0; visibility: hidden; }
        .zoom-logo { font-size: 3rem; font-weight: 900; background: linear-gradient(45deg, var(--accent-purple), var(--neon-glow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }

        /* 👑 НАВИГАЦИОННЫЙ ТУЛБАР ВЕРХУ */
        .top-navbar { position: absolute; top: 25px; right: 25px; display: flex; align-items: center; gap: 12px; z-index: 5; }
        .action-link-btn { background-color: var(--card-bg); color: var(--text-color); border: 1px solid var(--accent-purple); border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; font-weight: bold; text-decoration: none; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3); white-space: nowrap; }
        .action-link-btn:hover { border-color: var(--neon-glow); color: #fff; background-color: rgba(138, 43, 226, 0.15); box-shadow: 0 0 12px rgba(191,85,236,0.3); }
        .settings-btn { background: none; border: none; cursor: pointer; color: var(--text-color); padding: 0; display: flex; align-items: center; justify-content: center; transition: transform 0.3s ease, color 0.3s; filter: drop-shadow(0 0 8px rgba(191, 85, 236, 0.2)); }
        .settings-btn:hover { color: var(--neon-glow); transform: rotate(90deg); }
        .settings-btn svg { width: 32px; height: 32px; fill: currentColor; }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 4rem; margin: 0; font-weight: 900; background: linear-gradient(45deg, var(--accent-purple), var(--neon-glow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; filter: drop-shadow(0 0 15px rgba(191, 85, 236, 0.3)); }
        
        /* ТРЕУГОЛЬНЫЙ РЯД КНОПОК ПО СЕРЕДИНЕ */
        .buttons-container { display: flex; gap: 20px; max-width: 900px; width: 100%; z-index: 2; align-items: center; justify-content: center; }
        .nav-btn { flex: 1; background-color: var(--card-bg); color: var(--text-color); border: 2px solid var(--accent-purple); border-radius: 12px; padding: 24px 15px; font-size: 1.15rem; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; transition: all 0.3s cubic-bezier(0.1, 1, 0.1, 1); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); white-space: nowrap; }
        .nav-btn:hover { background-color: var(--accent-purple); color: #fff; transform: translateY(-5px); box-shadow: 0 0 25px rgba(138, 43, 226, 0.6); border-color: var(--neon-glow); }
        .nav-btn-myth { border-color: var(--myth-orange); color: #fff; background: rgba(255,159,0,0.05); }
        .nav-btn-myth:hover { background-color: var(--myth-orange); box-shadow: 0 0 25px rgba(255,159,0,0.6); border-color: #ffa726; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 8, 19, 0.8); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 10; backdrop-filter: blur(4px); }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background-color: var(--card-bg); border: 2px solid var(--accent-purple); border-radius: 16px; padding: 30px; max-width: 620px; width: 100%; box-shadow: 0 0 30px rgba(138, 43, 226, 0.4); transform: scale(0.85); transition: transform 0.3s ease; box-sizing: border-box; position: relative; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header { font-size: 1.6rem; font-weight: bold; margin-bottom: 20px; color: #fff; border-bottom: 1px solid #302654; padding-bottom: 10px; }
        .modal-close-btn { width: 100%; background-color: var(--accent-purple); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .modal-close-btn:hover { background-color: var(--neon-glow); }

        /* СЕТКА ТАБОВ МИФОВ */
        .myths-tabs-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
        .myth-tab-btn { background-color: var(--input-bg); border: 1px solid #302654; color: #bfaee3; padding: 10px 5px; font-size: 0.85rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .myth-tab-btn:hover { border-color: var(--myth-orange); }
        .myth-tab-btn.active { background-color: rgba(255, 159, 0, 0.15); border-color: var(--myth-orange); color: #fff; box-shadow: 0 0 10px rgba(255,159,0,0.2); }
        
        .myth-display-box { background-color: #0b0813; border: 1px solid #302654; border-radius: 8px; padding: 22px; min-height: 310px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-start; position: relative; overflow: hidden; }
        .myth-text-title { font-size: 1.15rem; font-weight: bold; color: #ff5252; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .myth-text-desc { font-size: 0.95rem; color: #e2daf8; line-height: 1.6; margin-bottom: 15px; }

        /* 🔄 МОЩНАЯ КИНЕМАТОГРАФИЧЕСКАЯ ЗАГРУЗКА РАДАР + КОД (ПП. 2 ТВОЕГО ЗАПРОСА) */
        .real-loader-box { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin: 20px 0; }
        .real-loader-box.active { display: flex; }
        
        .loading-radar {
            width: 70px; height: 70px; border: 3px double transparent; border-top-color: var(--myth-orange); border-bottom-color: var(--myth-orange);
            border-radius: 50%; animation: spinRadar 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; filter: drop-shadow(0 0 15px var(--myth-orange));
        }
        @keyframes spinRadar { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } 100% { transform: rotate(360deg) scale(1); } }
        
        .percent-counter { font-size: 2.2rem; font-weight: 900; color: #fff; margin-top: 15px; font-family: monospace; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .matrix-log-text { font-size: 0.75rem; color: #8b949e; font-family: monospace; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .myth-subs { font-size: 1.2rem; font-weight: 900; color: var(--myth-orange); text-align: center; margin-top: 20px; min-height: 45px; text-shadow: 0 0 12px rgba(255,159,0,0.4); line-height: 1.4; }

        /* 📊 ЖИВОЙ ПРИМЕР СРАВНЕНИЯ ВИДЕОКАРТ (ПП. 3 ТВОЕГО ЗАПРОСА) */
        .myth-live-battle { display: none; flex-direction: column; gap: 16px; margin-top: 15px; width: 100%; border-top: 1px solid #211a3d; padding-top: 15px; }
        .myth-live-battle.active { display: flex; }
        .myth-bar-item { background: #140e28; padding: 14px; border-radius: 8px; border: 1px solid #302654; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .myth-bar-label { font-size: 0.9rem; color: #bfaee3; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; }
        .myth-bar-bg { background-color: #0b0813; border-radius: 6px; height: 24px; overflow: hidden; position: relative; border: 1px solid #211a3d; }
        .myth-bar-fill { height: 100%; width: 0%; transition: width 1.5s cubic-bezier(0.1, 1, 0.1, 1); display: flex; align-items: center; padding-left: 12px; font-size: 0.85rem; font-weight: bold; color: #fff; box-sizing: border-box; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .b-red { background: linear-gradient(90deg, #e55350, #ff7070); box-shadow: 0 0 10px rgba(229,83,80,0.3); }
        .b-green { background: linear-gradient(90deg, #2ea043, #3fb950); box-shadow: 0 0 10px rgba(63,185,80,0.3); }

        @media (max-width: 850px) { .buttons-container { flex-direction: column; gap: 15px; padding: 0 10px; } .nav-btn { width: 100%; padding: 20px; font-size: 1.1rem; } .header h1 { font-size: 2.8rem; } .myths-tabs-grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
    <!-- ДОПОЛНИТЕЛЬНЫЕ ОКНА ДЛЯ СТАБИЛЬНОСТИ -->
    <div class="modal-overlay" id="suggestOverlay"><div class="modal-content"><div class="modal-header">Предложения</div><button class="modal-close-btn" onclick="closeSuggestModal()">Закрыть</button></div></div>
    <div class="modal-overlay" id="reviewOverlay"><div class="modal-content"><div class="modal-header">Отзывы</div><button class="modal-close-btn" onclick="closeReviewModal()">Закрыть</button></div></div>

    <script>
        // БАЗА ДАННЫХ 5 ЖЕЛЕЗНЫХ МИФОВ
        const mythsDatabase = {
            ru: {
                1: { title: "МИФ 1: Чем больше гигабайт памяти — тем мощнее видеокарта!", desc: "Абсолютная ложь! Объем памяти (VRAM) — это просто размер 'склада'. Если сам графический чип слабый, а шина памяти узкая, то хоть 32 гигабайта туда поставь — карта будет безбожно лагать. Быстрая память (GDDR6X/GDDR7) на широкой шине и мощный чип всегда в щепки уничтожат пустые медленные гигабайты." },
                2: { title: "МИФ 2: Процессоры Core i9 всегда лучше для игр, чем Core i5!", desc: "Неправда. В играх решает производительность на одно ядро, а не их общее количество. Флагманские i9 просто сильнее греются и стоят в два раза дороже, давая в играх всего 5-10% прироста по сравнению с современным i5." },
                3: { title: "МИФ 3: Чем больше Ватт потребляет блок питания, тем больше счет за свет!", desc: "Заблуждение. Блок питания на 1000W не берет из розетки киловатт постоянно. Он берет ровно столько, сколько просит твое железо в данный момент (например, 350 Ватт в игре)." },
                4: { title: "МИФ 4: Разгон комплектующих мгновенно сжигает компьютер!", desc: "Современное железо имеет встроенные многоуровневые системы защиты от перегрева (трэтлинг). При опасной температуре чип сбросит частоты или выключит ПК, но не сгорит." },
                5: { title: "МИФ 5: Жидкостное охлаждение (водянка) никогда не протекает!", desc: "Риск есть всегда. Даже дорогие СЖО со временем могут дать течь из-за высыхания шлангов или брака помпы. Хорошая тяжелая башня кулера намного безопаснее." }
            }
        };

        let currentLanguage = 'ru';

        // 🎙️ ХАКЕРСКИЙ КИНЕМАТОГРАФИЧЕСКИЙ БРУТАЛЬНЫЙ ГОЛОС
        function speakAI(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Находим глубокий мужской голос в системе
            const voices = window.speechSynthesis.getVoices();
            const deepVoice = voices.find(v => v.lang.includes('ru') && (v.name.includes('Male') || v.name.includes('Google') || v.name.includes('Microsoft')));
            if(deepVoice) utterance.voice = deepVoice;

            utterance.lang = 'ru-RU';
            utterance.rate = 0.88; // Нарочито замедленный темп для брутальности
            utterance.pitch = 0.45; // Максимально низкий бас грозного ИИ
            window.speechSynthesis.speak(utterance);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('cinema-intro');
                if(intro) intro.classList.add('fade-out');
            }, 700);
            if(window.speechSynthesis) window.speechSynthesis.getVoices();
        });

        function openMythsModal(e) { e.preventDefault(); document.getElementById('mythsOverlay').classList.add('active'); }
        function closeMythsModal() { document.getElementById('mythsOverlay').classList.remove('active'); window.speechSynthesis.cancel(); }

        let mythActiveAnimation = false;
        function switchMyth(num) {
            if (mythActiveAnimation) return;

            for(let i=1; i<=5; i++) document.getElementById(`mTab${i}`).classList.remove('active');
            document.getElementById(`mTab${num}`).classList.add('active');

            const mTitle = document.getElementById('mythTitle');
            const mDesc = document.getElementById('mythDesc');
            const mSubs = document.getElementById('mythSubsBlock');
            const mBattle = document.getElementById('mythLiveBattle');
            const mLoader = document.getElementById('realLoaderBox');
            const mPercent = document.getElementById('percentCounter');
            const mLog = document.getElementById('matrixLog');

            document.getElementById('mythBar1').style.width = '0%';
            document.getElementById('mythBar2').style.width = '0%';

            if (num === 1) {
                // 🔄 ТАЙМЛАЙН ХАКЕРСКОГО ВЗЛОМА ДЛЯ МИФА 1
                mythActiveAnimation = true;
                mTitle.style.display = 'none';
                mDesc.style.display = 'none';
                mBattle.classList.remove('active');
                
                // Включаем радар и счетчик
                mLoader.classList.add('active');
                mSubs.style.display = 'block';
                
                mSubs.innerText = "CRITICAL OVERLOAD... ТЫ РЕАЛЬНО ДУМАЛ, ЧТО ЭТО ПРАВДА?! 🤖";
                speakAI("Ты реально думал, что это правда?");

                // Счётчик процентов от 0% до 100% ровно на 5 секунд
                let progress = 0;
                mPercent.innerText = "0%";
                const logs = ["READING CACHE...", "SCANNING VRAM BUS...", "FETCHING PASSMARK REPO...", "DECODING SPECIFICATIONS...", "COMPILING EVIDENCE..."];
                
                let percentInterval = setInterval(() => {
                    progress += 1;
                    mPercent.innerText = progress + "%";
                    if (progress % 20 === 0 && progress < 100) {
                        mLog.innerText = logs[Math.floor(progress / 20)];
                    }
                    if (progress >= 100) {
                        clearInterval(percentInterval);
                    }
                }, 48);

                // Через 5 секунд: "Сейчас я всё расскажу!"
                setTimeout(() => {
                    mLog.innerText = "OVERRIDE COMPLETE. BROADCASTING LIVE DATA...";
                    mSubs.innerText = "DECODING PROVED... СЕЙЧАС Я ВСЁ РАССКАЖУ! 🎙️";
                    speakAI("Сейчас я всё расскажу.");
                }, 5000);

                // Через 7.2 секунды: Конец загрузки, вывод доказательств видеокарт!
                setTimeout(() => {
                    mLoader.classList.remove('active');
                    mSubs.style.display = 'none';
                    mTitle.style.display = 'block';
                    mDesc.style.display = 'block';
                    mBattle.classList.add('active');
                    
                    const data = mythsDatabase.ru;
                    mTitle.innerText = data.title;
                    mDesc.innerText = data.desc;

                    // Запускаем точные шкалы параллельного сравнения карт (PassMark G3D Mark)
                    setTimeout(() => {
                        const bar1 = document.getElementById('mythBar1');
                        const bar2 = document.getElementById('mythBar2');
                        bar1.style.width = '20%'; bar1.innerText = '5123 pts (GTX 1060)';
                        bar2.style.width = '98%'; bar2.innerText = '25114 pts (RTX 4070 Ti)';
                    }, 50);

                    mythActiveAnimation = false;
                }, 7200);

            } else {
                // Мгновенный вывод для остальных мифов
                mTitle.style.display = 'block';
                mDesc.style.display = 'block';
                mLoader.classList.remove('active');
                mSubs.style.display = 'none';
                mBattle.classList.remove('active');

                const data = mythsDatabase.ru[num];
                mTitle.innerText = data.title;
                mDesc.innerText = data.desc;
            }
        }

        function openSuggestModal(e) { e.preventDefault(); document.getElementById('suggestOverlay').classList.add('active'); }
        function closeSuggestModal() { document.getElementById('suggestOverlay').classList.remove('active'); }
        function openReviewModal(e) { e.preventDefault(); document.getElementById('reviewOverlay').classList.add('active'); }
        function closeReviewModal() { document.getElementById('reviewOverlay').classList.remove('active'); }

        const openBtn = document.getElementById('openSettings'); const closeBtn = document.getElementById('closeSettings'); const overlay = document.getElementById('modalOverlay');
        if(openBtn) openBtn.addEventListener('click', () => { overlay.classList.add('active'); });
        if(closeBtn) closeBtn.addEventListener('click', () => { overlay.classList.remove('active'); });
    </script>
</body>
</html>
