  select, button { padding: 12px 20px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; background-color: white; cursor: pointer; width: 100%; outline: none; font-weight: bold; box-sizing: border-box; }
  select:focus { border-color: #0071e3; }
  button { background-color: #0071e3; color: white; border: none; transition: background 0.2s; }
  button:hover { background-color: #005bb5; }
  .result-box { display: none; width: 100%; max-width: 500px; margin: 0 auto; background: #ffffff; border: 2px solid #f0f0f2; padding: 15px; border-radius: 16px; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.05); box-sizing: border-box; }
  .metric-title { font-size: 14px; font-weight: bold; margin-top: 15px; margin-bottom: 5px; color: #555; }
  .gpu-label { font-size: 13px; font-weight: 500; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
  .bar-container { background-color: #e5e5ea; border-radius: 8px; height: 24px; width: 100%; margin-bottom: 12px; overflow: hidden;
}
  .bar-fill { height: 100%; border-radius: 8px; transition: width 1s ease-in-out; display: flex; align-items: center; padding-left: 10px; color: white; font-weight: bold; font-size: 12px; box-sizing: border-box; }
  .bg-vram { background: linear-gradient(90deg, #0071e3, #00c7ff); }
  .bg-watts { background: linear-gradient(90deg, #ff9500, #ffcc00); }
  .bg-power { background: linear-gradient(90deg, #76b900, #5da300); }
  .verdict { margin-top: 20px; padding: 12px; background-color: #e8f4ff; border-radius: 8px; font-size: 14px; line-height: 1.4; font-weight: 500; border-left: 5px solid #0071e3; }
  @media (max-width: 600px) { padding-bottom: 450px !important; .compare-container { padding: 15px; } .gpu-label { flex-direction: column; align-items: flex-start; gap: 2px; } }

    <div class="gpu-label"><b>${card1.n}</b> <span>${card1.p} баллов</span></div>
    <div class="bar-container"><div class="bar-fill bg-power" style="width: ${(card1.p/maxP)*100}%">${card1.p}</div></div>
    <div class="gpu-label"><b>${card2.n}</b> <span>${card2.p} баллов</span></div>
    <div class="bar-container"><div class="bar-fill bg-power" style="width: ${(card2.p/maxP)*100}%">${card2.p}</div></div>
  `;
  
  let diff = Math.abs(card1.p - card2.p);
  let winner = card1.p > card2.p ? card1.n : card2.n;
  document.getElementById("verdictText").innerHTML = diff === 0 ? "Карты абсолютно равны." : `Модель <b>${winner}</b> мощнее в тестах ровно на <b>${diff}</b> балла(ов)!`;
  document.getElementById("resultBox").style.display = "block";
}
</script>
</body>
</html>
