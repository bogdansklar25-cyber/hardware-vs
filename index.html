<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareVS — Сравнение комплектующих</title>
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: #140e28;
            --accent-purple: #8a2be2;
            --neon-glow: #bf55ec;
            --text-color: #e2daf8;
            --myth-yellow: #ffc107;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; box-sizing: border-box; overflow: hidden; position: relative;
        }

        /* 🎬 МГНОВЕННЫЙ ПРЕЛОАДЕР ПРИ ВХОДЕ (0.7 сек) */
        #cinema-intro { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #05030a; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 9999; transition: opacity 0.4s ease, visibility 0.4s; 
        }
        #cinema-intro.fade-out { opacity: 0; visibility: hidden; }
        .zoom-logo { 
            font-size: 3.5rem; font-weight: 900; 
            background: linear-gradient(45deg, var(--accent-purple), var(--neon-glow)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; 
            filter: drop-shadow(0 0 15px rgba(191, 85, 236, 0.4));
        }
        
        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { 
            font-size: 4rem; margin: 0; font-weight: 900; 
            background: linear-gradient(45deg, var(--accent-purple), var(--neon-glow)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; 
            filter: drop-shadow(0 0 15px rgba(191, 85, 236, 0.3)); 
        }
        
        /* 🖥 ИДЕАЛЬНЫЙ ТРЕУГОЛЬНЫЙ РЯД КНОПОК ПК */
        .buttons-container { display: flex; gap: 20px; max-width: 950px; width: 100%; align-items: center; justify-content: center; }
        .nav-btn { 
            flex: 1; background-color: var(--card-bg); color: var(--text-color); border: 2px solid var(--accent-purple); 
            border-radius: 12px; padding: 26px 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; 
            text-align: center; text-decoration: none; transition: all 0.3s cubic-bezier(0.1, 1, 0.1, 1); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); white-space: nowrap; 
        }
        .nav-btn:hover { 
            background-color: var(--accent-purple); color: #fff; transform: translateY(-5px); 
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.6); border-color: var(--neon-glow); 
        }
        
        /* Центральная огненная кнопка мифов */
        .nav-btn-myth { border-color: var(--myth-yellow); color: #fff; background: rgba(255,193,7,0.03); }
        .nav-btn-myth:hover { 
            background-color: var(--myth-yellow); color: #0b0813; 
            box-shadow: 0 0 25px rgba(255,193,7,0.5); border-color: #ffa726; 
        }

        @media (max-width: 850px) { .buttons-container { flex-direction: column; gap: 15px; } .nav-btn { width: 100%; } .header h1 { font-size: 2.8rem; } }
    </style>
</head>
<body>

    <!-- 🎬 БЫСТРЫЙ ПРЕЛОАДЕР ПРИ ВХОДЕ (0.7 сек) -->
    <div id="cinema-intro">
        <div class="zoom-logo">HardwareVS</div>
    </div>

    <div class="header">
        <h1>HardwareVS</h1>
    </div>

    <!-- 🖥 ИДЕАЛЬНЫЙ ТРЕУГОЛЬНЫЙ РЯД КНОПОК ПО ЦЕНТРУ -->
    <div class="buttons-container">
        <a href="gpu.html" class="nav-btn">Сравнить видеокарты</a>
        <a href="myths.html" class="nav-btn nav-btn-myth">🔥 Разрушение Мифов</a>
        <a href="cpu.html" class="nav-btn">Сравнить процессоры</a>
    </div>

    <script>
        // Короткий красивый прелоадер на входе, чтобы сайт открывался мгновенно
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('cinema-intro');
                if (intro) intro.classList.add('fade-out');
            }, 700);
        });
    </script>
</body>
</html>
